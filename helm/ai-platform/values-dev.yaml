# helm/ai-platform/values-dev.yaml — Phase 5: the polaris-dev environment.
#
# Same shape as deploy/k8s/ai-service/*.yaml (Phase 4), which only ever applied to polaris-dev.
# Migrating that namespace from raw manifests to this chart is a `make deploy-delete` (removes
# the Phase 4 resources, keeps the namespace) followed by `make helm-apply-dev` — see the Phase 5
# guide, "Steg 3".
environment: dev
namespace: polaris-dev

ingress:
  host: ai.localhost

# Phase 9/11. Only dev turns these on in this delivery — same "prove it in one environment first"
# pattern Phase 5 itself used before staging/prod existed. Turning the OTel flags on here is only
# safe AFTER deploy/platform/observability/ has been installed (see values.yaml's comments on
# serviceMonitor.enabled and config.POLARIS_OTEL_ENABLED, and the Phase 9 guide's step order);
# turning the backend to "openai_compat" is only safe AFTER deploy/platform/model-serving/ has
# been installed AND the configured model has been pulled (make model-serving-install, make
# model-serving-pull — see docs/model-serving.md). Do not cherry-pick this block into
# values-staging.yaml/values-prod.yaml without doing the matching install in those clusters first.
config:
  POLARIS_ENVIRONMENT: "dev"
  POLARIS_OTEL_ENABLED: "true"
  # Phase 11: a real model server instead of the mock. OLLAMA_MODEL below must match
  # versions.env's OLLAMA_MODEL exactly (tests/bootstrap/test_static.sh checks this) — it is the
  # model name Ollama reports back on GET /v1/models, which OpenAICompatBackend.check_ready() now
  # verifies is actually loaded before GET /readyz reports ready (see that class's docstring).
  # ollama.model-serving.svc.cluster.local is the DNS name deploy/platform/model-serving/
  # service.yaml creates; no NetworkPolicy change was needed on this side (ai-service's own
  # NetworkPolicy only restricts *ingress*, so its existing, unrestricted egress already reaches
  # the model-serving namespace — model-serving's own NetworkPolicy is what actually restricts
  # this, by only allowing ingress from polaris-dev).
  POLARIS_BACKEND: "openai_compat"
  POLARIS_OPENAI_BASE_URL: "http://ollama.model-serving.svc.cluster.local:11434/v1"
  POLARIS_OPENAI_MODEL: "llama3.2:1b-instruct-q4_K_M"
  # A cold Ollama model load measured ~50s for real on the target machine (see
  # docs/troubleshooting.md, Phase 11) -- comfortably past the 30s default in
  # app/ai_service/src/ai_service/config.py's backend_timeout_s. 90s leaves real margin
  # over that measurement. Dev-only: staging/prod stay on the mock backend (see above), so
  # their values files keep the 30s default untouched.
  POLARIS_BACKEND_TIMEOUT_S: "90"

serviceMonitor:
  enabled: true

# Phase 12: dev is the one environment proven end to end with ai-gateway in front of
# ai-service -- same "prove it in one environment first" pattern as the OTel/backend block
# above. staging/prod are untouched (gateway.enabled stays false there), so Traefik keeps
# reaching ai-service directly in both, exactly as before this phase.
gateway:
  enabled: true
  config:
    GATEWAY_ENVIRONMENT: "dev"
    # Must stay >= POLARIS_BACKEND_TIMEOUT_S above (90) plus a margin, or the gateway would
    # give up on a cold Ollama load that ai-service is still legitimately waiting on -- see
    # gateway/config.py's own comment. 95 = 90 + a 5s margin, not gateway/config.py's generic
    # default (which is already >= 90, but set explicitly here rather than relying on a
    # default staying in sync with a number that lives in a different file).
    GATEWAY_UPSTREAM_TIMEOUT_S: "95"
    GATEWAY_OTEL_ENABLED: "true"
  # Overridden at install time by scripts/deploy/helm.sh's cmd_apply from
  # deploy/platform/gateway/api-keys.dev.local.json (gitignored; see
  # deploy/platform/gateway/api-keys.dev.example.json for the format). Left at the chart's own
  # "{}" default here deliberately -- a real tenant/key map does not belong in a committed
  # values file even for a local-only demo (see ADR-30).
