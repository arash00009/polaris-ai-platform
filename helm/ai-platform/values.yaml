# helm/ai-platform/values.yaml — Phase 5: shared defaults for every environment.
#
# environment/namespace/ingress.host have no default on purpose: every install must pick an
# environment explicitly with `-f values-<env>.yaml`, so nobody accidentally installs into
# "default". scripts/deploy/helm.sh always passes one of the three env files; it never installs
# from this file alone.
#
# Everything below this line is identical to what deploy/k8s/ai-service/*.yaml (Phase 4) already
# applies to polaris-dev — same security posture, same probes, same resource estimate. Phase 5
# does not change what gets deployed, only how many copies of it can exist without duplicating
# YAML (docs/architecture.md roadmap, Phase 5 "Done when").

environment: ""
namespace: ""

nameOverride: "ai-service"

image:
  # Cluster-internal registry reference (matches the REG_NAME:5000/<repo> pattern from
  # scripts/deploy/app.sh — see deploy/k3d/cluster.yaml for where the registry name comes from).
  repository: "registry.localhost:5000/polaris/ai-service"
  # No default: scripts/deploy/helm.sh always passes --set image.tag=<version>-<git-sha>,
  # computed the same way as Phase 3/4 (app_version() + app_revision()). A missing tag fails the
  # template render (see the `required` guard in templates/deployment.yaml) rather than silently
  # deploying nothing or "latest" (ADR-19).
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

# Non-secret POLARIS_* settings — identical to deploy/k8s/ai-service/configmap.yaml. Every
# environment runs the mock backend until Phase 11 wires a real model server.
config:
  POLARIS_BACKEND: "mock"
  POLARIS_LOG_LEVEL: "INFO"
  POLARIS_READY_TIMEOUT_S: "2"
  POLARIS_MOCK_MODEL_NAME: "mock-1"
  POLARIS_MOCK_READY: "true"
  # Phase 9 (Observability). Off at this shared-defaults level on purpose: turning traces/logs
  # on here would make every environment depend on the observability namespace existing before
  # its very first install. Each values-<env>.yaml turns it on explicitly, and only after
  # deploy/platform/observability/ has been installed there first — see docs/observability.md
  # and the Phase 9 guide's "Common errors" for what breaks if the order is reversed.
  POLARIS_OTEL_ENABLED: "false"
  POLARIS_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  # POLARIS_ENVIRONMENT is set per values-<env>.yaml, not here — "local" (ai_service/config.py's
  # own default) would be wrong for every one of them.

# Starting point only: the Phase 3 `docker run` figures, not measured under load (ADR-22,
# docs/component-qa.md). Identical across environments — Phase 5 varies replica count and the
# disruption budget per environment (legitimate operational knobs), not resource numbers nobody
# has measured. Phase 9 makes the real numbers available (Prometheus CPU/memory history per pod)
# but does not itself replace these — see values-prod.yaml's comment. Still open for Phase 11.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 3
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 15

# Mitigates, does not fix, the Phase 3 gap (ADR-20): /readyz does not flip on shutdown.
lifecycle:
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 15

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowFromNamespace: kube-system
  allowPort: 8000
  # Phase 9: a second ingress rule (additive to allowFromNamespace above) so Prometheus, running
  # in the observability namespace, can scrape GET /metrics. The Deployment's egress is already
  # unrestricted (templates/networkpolicy.yaml only sets policyTypes: ["Ingress"]), so nothing
  # extra is needed for the app to push traces/logs out to the OTel Collector in that namespace.
  allowScrapeFromNamespace: observability

# Phase 9. False at this shared-defaults level for the same reason POLARIS_OTEL_ENABLED is:
# ServiceMonitor is a CRD installed by kube-prometheus-stack (deploy/platform/observability/),
# and `helm install`/Argo CD's sync would fail with "no matches for kind ServiceMonitor" if this
# were on before that CRD exists. Each values-<env>.yaml turns it on explicitly, and only after
# confirming the CRD is present (`kubectl get crd servicemonitors.monitoring.coreos.com`).
serviceMonitor:
  enabled: false
  # How often Prometheus scrapes GET /metrics. Checked for real against the pinned chart
  # (kube-prometheus-stack 91.5.0's values.yaml): prometheus.prometheusSpec.scrapeInterval is ""
  # by default, which falls back to Prometheus Operator's own default of 1m. 30s here is a
  # deliberate, tighter choice for this one low-traffic local service — dashboards feel more
  # responsive while demoing this phase, and one extra scrape every 30s is not worth trading
  # that away for. Not a claim that it matches any upstream default.
  interval: 30s

ingress:
  enabled: true
  className: traefik
  # No default — every environment file sets its own host so Traefik can route to the right
  # release by Host header (all three share the same k3d ingress port).
  host: ""

podSecurityStandard:
  version: "v1.34"
