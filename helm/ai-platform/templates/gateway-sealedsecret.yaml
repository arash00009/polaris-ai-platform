# helm/ai-platform/templates/gateway-sealedsecret.yaml — Phase 15 / ADR-33.
#
# Closes the gap ADR-30 named explicitly ("Not wired into Sealed Secrets: that is Phase 15's own
# scope") and the limitation ADR-30 later confirmed for real: an Argo CD `ignoreDifferences`
# entry does NOT stop `selfHeal` from reverting the gateway's real Secret back to this chart's
# placeholder (docs/troubleshooting.md, Phase 12). The fix here is not "make selfHeal leave this
# object alone" -- it is "make the committed object itself safe to sync", so selfHeal reverting
# it to the committed state is now correct, not a bug to work around.
#
# This is a bitnami.com/v1alpha1 SealedSecret, a Custom Resource the sealed-secrets controller
# (deploy/platform/sealed-secrets/, scripts/bootstrap/sealed-secrets.sh) watches for. On seeing
# one, the controller decrypts spec.encryptedData with its own private key (which never leaves
# the cluster) and creates/updates a plain Secret from spec.template -- so from ai-gateway's own
# point of view (gateway-deployment.yaml's envFrom), nothing changes: a Secret named
# ai-gateway-api-keys still appears in this namespace with a GATEWAY_API_KEYS_JSON key, same as
# templates/gateway-secret.yaml's plain Secret produced directly before. Mutually exclusive with
# that template (see its own comment) -- exactly one of the two renders for a given environment.
#
# .Values.gateway.apiKeysSealed is ciphertext, not a credential -- SAFE to commit to this
# values file (and, through it, to the separate polaris-gitops repository) as-is. That is the
# entire point of Sealed Secrets, same distinction ADR-30 already drew for
# GATEWAY_TENANT_LIMITS_JSON (a ConfigMap, not a Secret, because tier numbers are not
# credentials) applied the other direction: this value LOOKS like a secret-shaped field name but
# holds no actual secret material once sealed. See scripts/deploy/seal-gateway-secret.sh for how
# it is produced, and docs/security/secrets-management.md for the full, honest accounting
# (including what Sealed Secrets does NOT protect against -- anyone who can read SealedSecrets
# and reach the controller's decrypt endpoint, i.e. anyone with cluster access, can still recover
# the plaintext; this closes the GitOps-commit gap, not a "secrets are no longer sensitive" claim).
{{- if and .Values.gateway.enabled .Values.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ai-gateway-api-keys
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.gatewayLabels" . | nindent 4 }}
spec:
  encryptedData:
    GATEWAY_API_KEYS_JSON: {{ required "gateway.apiKeysSealed must hold a real sealed-secrets ciphertext once sealedSecrets.enabled is true -- run scripts/deploy/seal-gateway-secret.sh against the real controller first (see ADR-33)" .Values.gateway.apiKeysSealed | quote }}
  # Phase 15: the controller materialises exactly this template, filled in with the decrypted
  # data, as the real Secret -- so it must match templates/gateway-secret.yaml's own shape
  # (same name, same namespace, same type) for ai-gateway's envFrom to find it identically
  # either way.
  template:
    metadata:
      name: ai-gateway-api-keys
      namespace: {{ include "ai-platform.namespace" . }}
      labels:
        {{- include "ai-platform.gatewayLabels" . | nindent 8 }}
    type: Opaque
    # Phase 15 drops ADR-30's `argocd.argoproj.io/sync-options: Prune=false` annotation
    # entirely (compare templates/gateway-secret.yaml) -- that annotation existed only to
    # protect the directly-applied, bypass-GitOps Secret from being pruned by a sync it was
    # never really part of. This object IS meant to be GitOps-managed like any other resource
    # in the chart, so no sync-option override belongs here.
{{- end }}
