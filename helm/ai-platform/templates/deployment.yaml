# helm/ai-platform/templates/deployment.yaml — Phase 5.
#
# securityContext, probes and lifecycle are the same fields as deploy/k8s/ai-service/deployment.yaml
# (Phase 4) — only their source moved from hardcoded YAML to values.yaml. image.repository/tag
# replace the __AI_SERVICE_IMAGE__ sed substitution: scripts/deploy/helm.sh computes the same
# <version>-<git-sha> tag Phase 3/4 already use and passes it with --set, so there is still no
# "latest" (ADR-19) and a missing tag still fails fast instead of deploying silently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Forces a new rollout whenever templates/configmap.yaml's rendered content changes --
        # without this, envFrom: configMapRef below only points at a ConfigMap *by name*, so a
        # `helm upgrade --set config.X=...` changes the ConfigMap's data but the Deployment's own
        # PodTemplateSpec hash stays the same, and Kubernetes never creates a new ReplicaSet. The
        # running pods then keep their original environment indefinitely. Standard Helm pattern.
        # Discovered missing during Phase 7's first real deliberate-failure test -- see ADR-25 and
        # docs/troubleshooting.md.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required — scripts/deploy/helm.sh passes --set image.tag=<version>-<git-sha>" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
