# helm/ai-platform/templates/networkpolicy.yaml — Phase 5. Same two-object default-deny +
# allow-from-kube-system pattern as deploy/k8s/ai-service/networkpolicy.yaml (Phase 4, ADR-22).
# Same unresolved risk too: whether kubelet's own probe traffic is exempted from an "Ingress"
# policy is implementation-specific. Phase 4 verified this holds on the target machine's k3s;
# scripts/deploy/helm.sh applies this chart's NetworkPolicy the same way app.sh did — after the
# Deployment is healthy — and the Phase 5 guide says to re-check readiness per environment.
#
# Phase 15 / ADR-34 adds the third object below (ai-service-allow-egress) plus the conditional
# "Egress" policyType here. Kubernetes NetworkPolicies selecting the same pods are additive, the
# same way this file's own two ingress objects already combine (a bare default-deny plus however
# many separate allow-* objects) -- so putting "Egress" into this object's policyTypes with no
# egress: list switches this pod selector to deny-all-egress-by-default, and
# ai-service-allow-egress is what adds specific exceptions back, never this object itself.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service-default-deny
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service-allow-ingress
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Phase 12: once the gateway is in front of ai-service (gateway.enabled), Traefik must no
    # longer reach ai-service directly -- every chat request is meant to go through
    # ai-gateway's auth/rate-limit/quota checks (docs/architecture.md section 4.1's layer
    # table). This rule is Traefik-sourced (allowFromNamespace) only when the gateway is OFF
    # (values-staging.yaml/values-prod.yaml today -- unchanged, zero risk); when it is ON, the
    # equivalent rule instead allows ai-gateway's own pods (same namespace, pod-level selector),
    # which is what templates/ingress.yaml now routes through -- see ADR-30.
    {{- if .Values.gateway.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ai-platform.gatewaySelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.allowPort }}
    {{- else }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowFromNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.allowPort }}
    {{- end }}
    # Phase 9: Prometheus (in the observability namespace) scraping GET /metrics. A separate
    # `from` entry, not appended to the one above, because every namespaceSelector in the same
    # rule is OR'd with every port -- keeping them apart means allowFromNamespace's ingress is
    # never accidentally widened to allowScrapeFromNamespace's namespace or vice versa.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowScrapeFromNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.allowPort }}
{{- if .Values.networkPolicy.egress.enabled }}
---
# Phase 15 / ADR-34: what ai-service is actually allowed to call out to, now that the
# default-deny object above also covers Egress. Four separate `to` entries, not one combined
# list, for the same reason the ingress object above keeps allowFromNamespace and
# allowScrapeFromNamespace apart: each is independently reviewable and none can accidentally
# widen another.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service-allow-egress
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    # DNS. Every workload needs this regardless of what else it talks to -- without it, every
    # other rule below is moot, since Service DNS names never resolve.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dnsNamespace }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
    # model-serving (Ollama, Phase 11) -- only actually used when
    # config.POLARIS_BACKEND=openai_compat, but the rule itself is unconditional on that string
    # value (NetworkPolicy has no notion of "this app-level config flag"); an unused allow-rule
    # for the mock backend is a harmless no-op, not a widened attack surface, since nothing in
    # the mock path ever originates this connection. model-serving's own NetworkPolicy
    # (deploy/platform/model-serving/networkpolicy.yaml) separately only accepts ingress from
    # polaris-dev regardless of what this rule allows out, so staging/prod granting themselves
    # egress here (same chart, same template, every environment) changes nothing in practice
    # until that file's own allow-list is ever widened to match -- named, not silently assumed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.modelServingNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.modelServingPort }}
    # OTel Collector (Phase 9/10) -- only actually used when config.POLARIS_OTEL_ENABLED=true,
    # same "harmless unused allow-rule" reasoning as model-serving above. Both OTLP ports
    # (gRPC 4317, HTTP 4318) are allowed since telemetry.py's own exporter choice is a runtime
    # config detail this NetworkPolicy does not need to track.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otlpGrpcPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otlpHttpPort }}
{{- end }}
{{- end }}
