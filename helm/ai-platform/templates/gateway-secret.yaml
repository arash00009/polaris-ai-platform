# helm/ai-platform/templates/gateway-secret.yaml — Phase 12.
#
# The one real Secret this project has needed so far (ADR-10 proposed Sealed Secrets for
# GitOps secrets back in Phase 0, but nothing before this phase actually held a secret value --
# openai_base_url/openai_api_key exist in ai_service/config.py since Phase 2 but are unused
# against a local, auth-less Ollama). Sealed Secrets itself is explicitly NOT wired up here --
# that is Phase 15's scope (security/supply chain) -- so this is a plain Kubernetes Secret,
# LOCAL/DEMONSTRATION, named as a real gap rather than silently left for later. See ADR-30 and
# docs/gateway.md section 5 for the honest accounting of what this means for GitOps (Argo CD,
# Phase 8): a plain Secret applied outside of Argo CD's own sync would be reverted by it on the
# next sync (the same self-heal behaviour Phase 8's handoff demonstrated deliberately on a
# Deployment) unless it is committed into polaris-gitops too -- which would put the key/tenant
# map in cleartext in a GitHub repository. scripts/deploy/helm.sh's cmd_apply therefore applies
# this chart directly with `helm upgrade --install` for dev's gateway secret specifically, the
# same manual, non-GitOps path app.sh/helm.sh already used before Phase 8 existed -- this one
# Secret is a deliberate, documented exception to "dev is GitOps-managed since Phase 8", not an
# oversight.
#
# .Values.gateway.apiKeysJson defaults to "{}" (see values.yaml) so `helm lint`/`helm template`
# never need a real secret to render. A real install passes the actual JSON blob via
# `--set-file gateway.apiKeysJson=<local, gitignored file>` -- scripts/deploy/helm.sh does this
# automatically from deploy/platform/gateway/api-keys.<env>.local.json when gateway.enabled is
# true for that environment, falling back to "{}" (every request 401s) if that file does not
# exist yet, with a loud warning rather than a silent empty deploy.
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-api-keys
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.gatewayLabels" . | nindent 4 }}
  annotations:
    # Phase 12 / ADR-30: this Secret's real content is applied directly (helm --set-file),
    # bypassing GitOps on purpose, so it never holds the real key/tenant map in cleartext in
    # polaris-gitops -- Argo CD's own render of this chart only ever sees the "{}" placeholder
    # default (values.yaml). Prune=false stops a `prune: true` auto-sync from deleting this
    # Secret outright on a `gateway.enabled: false -> true` edge case; it does NOT by itself
    # stop self-heal from overwriting stringData back to "{}" on every reconciliation -- that
    # also needs an `ignoreDifferences` entry for this resource on the Argo CD Application
    # itself (in polaris-gitops, not this chart -- see docs/gateway.md section 2.4/7 for the
    # exact block and why it has to live there, not here).
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  GATEWAY_API_KEYS_JSON: {{ .Values.gateway.apiKeysJson | quote }}
{{- end }}
