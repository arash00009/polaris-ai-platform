# helm/ai-platform/templates/rollout.yaml — Phase 5 (as deployment.yaml), converted to an Argo
# Rollouts Rollout in Phase 18 (ADR-39).
#
# securityContext, probes and lifecycle are the same fields as deploy/k8s/ai-service/deployment.yaml
# (Phase 4) — only their source moved from hardcoded YAML to values.yaml. image.repository/tag
# replace the __AI_SERVICE_IMAGE__ sed substitution: scripts/deploy/helm.sh computes the same
# <version>-<git-sha> tag Phase 3/4 already use and passes it with --set, so there is still no
# "latest" (ADR-19) and a missing tag still fails fast instead of deploying silently.
#
# Phase 18: `apiVersion`/`kind` and `spec.strategy` are the only new pieces here -- every pod-spec
# field below carries over from the plain Deployment this replaced unchanged. One-time migration
# note (ADR-39): every polaris-dev/-staging/-prod namespace already has a real Deployment named
# ai-service from Phase 4/5 onward; `kubectl delete deployment ai-service -n <namespace>
# --cascade=orphan` before the first `helm upgrade` to this chart version lets the already-running
# ReplicaSet/Pods be adopted by this Rollout by label selector, instead of Helm's own release
# diffing deleting the old Deployment outright and causing a brief full-recreate gap. See
# docs/progressive-delivery.md.
#
# Canary steps: setWeight 50, then a blocking analysis step (ai-service-canary-analysis.yaml),
# then setWeight 100. Not a finer 20/50/80 staircase: replicaCount is 2 (dev/staging) or 3 (prod)
# everywhere (Phase 5, for reasons unrelated to canary granularity), and without a trafficRouting
# plugin (Traefik is not one Argo Rollouts natively weights traffic through) a basic canary
# approximates weight by ReplicaSet pod count -- at 2-3 replicas a 20% step would silently round
# to 0% or 50% anyway, so 50% is the one step these real replica counts can actually produce.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ai-service
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: ai-service-canary-analysis
        - setWeight: 100
  template:
    metadata:
      annotations:
        # Forces a new rollout whenever templates/configmap.yaml's rendered content changes --
        # without this, envFrom: configMapRef below only points at a ConfigMap *by name*, so a
        # `helm upgrade --set config.X=...` changes the ConfigMap's data but the Deployment's own
        # PodTemplateSpec hash stays the same, and Kubernetes never creates a new ReplicaSet. The
        # running pods then keep their original environment indefinitely. Standard Helm pattern.
        # Discovered missing during Phase 7's first real deliberate-failure test -- see ADR-25 and
        # docs/troubleshooting.md.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required — scripts/deploy/helm.sh passes --set image.tag=<version>-<git-sha>" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
