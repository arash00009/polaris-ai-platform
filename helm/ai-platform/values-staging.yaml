# helm/ai-platform/values-staging.yaml — Phase 5: the polaris-staging environment.
#
# Same resource estimate as dev (nobody has load-tested either), same replica count — staging's
# only real difference from dev here is the namespace and the Host header Traefik routes on.
# That is intentional and honest for a single-developer local cluster: the point of this phase is
# proving three independently-installable releases from one chart, not inventing environment
# differences that no measurement backs up.
environment: staging
namespace: polaris-staging

ingress:
  host: ai-staging.localhost

# Phase 9. POLARIS_ENVIRONMENT is safe to set unconditionally (just an attribute on the app's own
# logs/spans). serviceMonitor.enabled and config.POLARIS_OTEL_ENABLED stay at values.yaml's false
# default here on purpose -- this delivery only proves the observability stack in polaris-dev
# (see values-dev.yaml's comment). Installing deploy/platform/observability/ into this namespace
# too and flipping the same two switches here is the natural next step, not done in Phase 9.
config:
  POLARIS_ENVIRONMENT: "staging"
