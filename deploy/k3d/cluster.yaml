# deploy/k3d/cluster.yaml — LOCAL cluster definition (k3d config, schema v1alpha5).
#
# One control-plane node + two agents in Docker containers. Traefik and
# metrics-server ship with k3s and stay enabled.
#
# The k3s image is the ONLY place the Kubernetes version is pinned.
# Keep kubectl (versions.env) within one minor version of it.
# Pinned to 1.34 on purpose: on WSL2 with cgroup v1 the kubelet of Kubernetes >= 1.35
# does not start (docs/adr/README.md, ADR-16). `make doctor` checks this.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: polaris
servers: 1
agents: 2
image: rancher/k3s:v1.34.10-k3s1
ports:
  # host:container — the k3d load balancer forwards to Traefik inside the cluster.
  # Ports above 1024 avoid needing root. WSL2 forwards localhost to Windows.
  # 8088/8448 (not 8080/8443) because 8080/8443 are commonly taken by other local
  # clusters (kind, etc.). scripts read these values from this file; change them only here.
  - port: 8088:80
    nodeFilters:
      - loadbalancer
  - port: 8448:443
    nodeFilters:
      - loadbalancer
registries:
  # A local, unauthenticated image registry for the inner development loop.
  # The container is named exactly as given here (no "k3d-" prefix; verified on k3d v5.9.0).
  # k3d writes a containerd mirror for "registry.localhost:5000" into every node:
  #   push from the host  -> localhost:5000/<repo>:<tag>
  #   pull in the cluster -> registry.localhost:5000/<repo>:<tag>
  create:
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
