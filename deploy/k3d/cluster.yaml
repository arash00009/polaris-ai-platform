# deploy/k3d/cluster.yaml — LOCAL cluster definition (k3d config, schema v1alpha5).
#
# One control-plane node + two agents in Docker containers. Traefik and
# metrics-server ship with k3s and stay enabled.
#
# The k3s image is the ONLY place the Kubernetes version is pinned.
# Keep kubectl (versions.env) within one minor version of it.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: polaris
servers: 1
agents: 2
image: rancher/k3s:v1.35.8-k3s1
ports:
  # host:container — the k3d load balancer forwards to Traefik inside the cluster.
  # Ports above 1024 avoid needing root. WSL2 forwards localhost to Windows.
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
registries:
  # A local, unauthenticated image registry for the inner development loop.
  # k3d prefixes the name with "k3d-":
  #   push from the host  -> localhost:5000/<repo>:<tag>
  #   pull in the cluster -> k3d-registry.localhost:5000/<repo>:<tag>
  create:
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
