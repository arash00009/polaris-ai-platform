# deploy/platform/sealed-secrets/sealed-secrets-values.yaml — Phase 15 / ADR-33.
#
# Confirmed for real against the chart's own values.yaml (bitnami-labs/sealed-secrets, main
# branch, fetched via raw.githubusercontent.com, 2026-10-13) -- every key below exists at that
# revision; nothing here is guessed from a Bitnami chart "in general." Deliberately minimal:
# only the keys this project has an actual, named reason to override. Everything else (image,
# probes, service, RBAC) stays at the chart's own default.
#
# containerSecurityContext at this chart's own default is already restricted-PSS-compliant
# (runAsNonRoot, readOnlyRootFilesystem, capabilities.drop: [ALL], runAsUser: 1001) -- but
# namespace.yaml still labels this namespace "baseline", not "restricted", because that is a
# claim about what the chart ASKS for, not a confirmation that this upstream image actually
# starts and stays healthy under it on this project's own k3s (same distinction model-serving's
# and observability's own namespace.yaml already draw, and no cluster to check it against in
# the sandbox this was written in). Tightening the namespace label once confirmed is a named
# follow-up, not assumed here.
#
# A fixed, predictable resource name (Deployment/Service/ServiceAccount all named exactly
# "sealed-secrets"), independent of whatever Helm release name is used -- so
# scripts/bootstrap/sealed-secrets.sh and scripts/deploy/seal-gateway-secret.sh's own
# `kubeseal --controller-name` can be a hardcoded constant instead of something that has to
# track the release name. Confirmed for real by reading templates/_helpers.tpl's own
# `sealed-secrets.fullname` definition (fullnameOverride short-circuits it entirely when set).
fullnameOverride: "sealed-secrets"

# Resources: the chart's own default is unset (resources: {limits: {}, requests: {}}, i.e. no
# constraint at all). A tiny, deliberately explicit budget instead -- NOT measured against a
# real running controller yet (no cluster in the sandbox this was written in), so these are an
# estimate in the same spirit as docs/architecture.md section 13's own RAM table ("estimates
# only; we measure the real numbers" on the target machine) -- confirm with `kubectl -n
# sealed-secrets top pod` after a real install and adjust this file in a follow-up commit if the
# actual numbers disagree, the same two-step every other estimate in this project has followed.
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 96Mi

# Least-privilege RBAC, confirmed for real by reading templates/cluster-role.yaml, role.yaml and
# deployment.yaml at the fetched revision (not assumed from the chart's name): with rbac.
# clusterRole left at its own default (true) and rbac.namespacedRoles left at its own default
# (false), this chart grants a cluster-scoped ClusterRole with get/list/create/update/delete/
# watch on secrets in EVERY namespace -- additionalNamespaces alone, without this block, changes
# nothing about that; it only adds `get` on specific Namespace objects, used by the
# --additional-namespaces controller flag the chart wires up automatically whenever
# additionalNamespaces is non-empty (deployment.yaml), regardless of the rbac.* settings below.
# Setting clusterRole: false + namespacedRoles: true together is what actually swaps the
# cluster-wide ClusterRole for a namespaced Role per entry in additionalNamespaces instead
# (role.yaml's own guard: `and (rbac.create and rbac.namespacedRoles) (not rbac.clusterRole)`) --
# so the controller's real API permissions, not only its own watch-namespace flag, are confined
# to the namespaces listed below.
rbac:
  clusterRole: false
  namespacedRoles: true

# The namespaces this project actually seals secrets into. Today that is only polaris-dev
# (ADR-30/ADR-33: only dev has gateway.enabled: true, so only dev ever has a secret to seal) --
# staging/prod are listed here too, ahead of actually needing them, so turning the gateway on
# there later (ADR-30's own "Revisit when") does not also require remembering to widen the
# controller's RBAC at the same time; an unused Role in a namespace nothing currently seals into
# is a harmless no-op, not a widened attack surface, the same reasoning this phase's egress
# NetworkPolicy rules (ADR-34) already use for an allow-rule nothing currently exercises. The
# controller's OWN namespace (sealed-secrets) deliberately is NOT in this list: role.yaml's
# namespaced-Role block only ranges over additionalNamespaces, never adding its own install
# namespace automatically, and nothing in this project ever creates a SealedSecret there -- a
# general secrets Role in its own namespace would be unused privilege, not a fix for anything.
additionalNamespaces:
  - polaris-dev
  - polaris-staging
  - polaris-prod
