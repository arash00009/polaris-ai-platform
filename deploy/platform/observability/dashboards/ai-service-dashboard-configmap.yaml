# deploy/platform/observability/dashboards/ai-service-dashboard-configmap.yaml — Phase 9.
#
# The grafana_dashboard=1 label is what kube-prometheus-stack-values.yaml's
# grafana.sidecar.dashboards config watches for (searchNamespace: ALL, so this does not need to
# live in the observability namespace itself). ai-service-dashboard.json is embedded verbatim as
# this ConfigMap's data -- edit that file, not this one, and re-run
# 'scripts/bootstrap/observability.sh dashboard-configmap' (or 'make obs-dashboard-configmap')
# to regenerate it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-dashboard
  namespace: observability
  labels:
    app.kubernetes.io/part-of: polaris
    grafana_dashboard: "1"
data:
  ai-service-dashboard.json: |
    {
      "title": "Polaris AI Service",
      "uid": "polaris-ai-service",
      "description": "Phase 9 (Observability). Scoped to namespace=polaris-dev -- see deploy/platform/observability/kube-prometheus-stack-values.yaml and docs/observability.md for why staging/prod are not wired up yet. Datasources are referenced by name (Prometheus/Loki/Tempo), matching the names kube-prometheus-stack-values.yaml provisions them under.",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "tags": ["polaris", "ai-service", "phase-9"],
      "panels": [
        {
          "id": 1,
          "title": "Request rate (by route)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"polaris-dev\"}[5m])) by (handler, method)",
              "legendFormat": "{{method}} {{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (4xx + 5xx / total)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"polaris-dev\",status=~\"4xx|5xx\"}[5m])) / sum(rate(http_requests_total{namespace=\"polaris-dev\"}[5m]))",
              "legendFormat": "error ratio"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency percentiles (p50 / p95 / p99)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"polaris-dev\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"polaris-dev\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"polaris-dev\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Pod restarts",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"polaris-dev\",container=\"ai-service\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pod CPU usage",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"polaris-dev\",container=\"ai-service\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Pod memory usage (working set)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"polaris-dev\",container=\"ai-service\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Recent logs (ai-service)",
          "type": "logs",
          "datasource": "Loki",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "{service_name=\"ai-service\"}"
            }
          ]
        }
      ]
    }
