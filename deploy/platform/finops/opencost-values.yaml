# deploy/platform/finops/opencost-values.yaml — Phase 13.
#
# Chart: opencost/opencost-helm-chart (repo opencost-charts, see versions.env for why the chart
# version itself is left unpinned, same "resolve for real, then pin" two-step as Loki/Tempo in
# Phase 9). Two blocks below ARE confirmed for real against opencost.io's own installation and
# on-prem configuration docs (fetched 2026-10-07, not guessed from a blog post or a training-data
# memory of some earlier chart version): opencost.prometheus.internal.* (where OpenCost reads
# cAdvisor/kube-state-metrics data FROM) and opencost.customPricing.* (the local rate card, since
# "on-prem" k3d has no cloud billing API for OpenCost to call instead).
#
# What is NOT in this file, and why: a serviceMonitor-style toggle for Prometheus to scrape
# OpenCost's OWN cost-allocation metrics (node_cpu_hourly_cost, container_cpu_allocation, etc. --
# see docs/finops.md for the full list this phase's dashboard queries) back out. The real
# installation docs for this chart describe scraping those through a SEPARATE chart
# (prometheus-community/prometheus-opencost-exporter), not a flag on this one -- confirmed only
# that far before running out of pages this sandbox could fetch for real. Guessing a values key
# here risks either silently doing nothing (most Helm charts ignore unknown keys) or a schema
# validation failure that breaks `helm install` outright, neither of which this project's
# "verify, don't guess" rule allows writing in on faith. This is therefore a NAMED, open item for
# the target-machine step, not something faked here: see docs/finops.md section 4 and
# docs/troubleshooting.md's Phase 13 entry for the exact `helm show values` command to run next.
#
# Namespace: deliberately its own ('finops'), same reasoning as every other platform component
# in this repo (observability, model-serving, gateway) -- a cost tool is not application
# workload and should not share polaris-dev/-staging/-prod's lifecycle.

opencost:
  prometheus:
    internal:
      # The real, pre-existing Prometheus this project already runs (Phase 9) -- OpenCost reads
      # cAdvisor container-usage series and kube-state-metrics node-capacity series from it; it
      # never gets its own ServiceMonitor target for those. 'observability' and port 9090 are
      # the chart's own defaults for a bundled Prometheus; this is NOT that -- kube-prometheus-
      # stack-values.yaml's fullnameOverride: kube-prometheus-stack means the chart's own
      # Prometheus Service is named "kube-prometheus-stack-prometheus" by the standard Helm
      # fullnameOverride convention (confirmed: this is how the chart's own _helpers.tpl applies
      # fullnameOverride, the same convention loki/tempo's un-overridden chart names already rely
      # on for Grafana's datasource URLs in kube-prometheus-stack-values.yaml) -- but this exact
      # Service name has NOT been confirmed against a real `kubectl get svc -n observability` on
      # the target machine, because there is no cluster in this sandbox. If `make finops-install`
      # fails to scrape any data (OpenCost's own /healthz or UI showing "no data"), this is the
      # first thing to check: `kubectl -n observability get svc` and correct serviceName below.
      enabled: true
      namespaceName: observability
      serviceName: kube-prometheus-stack-prometheus
      port: 9090
  # The local, illustrative rate card (docs/architecture.md section 11: "a local, configurable
  # rate card"). These are NOT real cloud or electricity prices -- they exist only so the FinOps
  # dashboard has SOME $/hour number to multiply CPU-seconds and GB-hours by, and every panel
  # built from them in this phase's dashboard carries the mandatory "ESTIMATE -- local, not
  # billing data" label (docs/architecture.md section 11's own requirement). Loosely anchored to
  # a small-instance on-demand cloud VM's blended $/vCPU-hour and $/GB-hour (the same rough
  # ballpark every public "Kubernetes cost per pod" explainer uses), rounded to memorable numbers
  # on purpose -- the point is a repeatable estimate methodology, not a particular number.
  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: "Polaris local illustrative rate card -- NOT real billing data (see docs/finops.md)"
      CPU: 0.03
      RAM: 0.004
      storage: 0.0001

  exporter:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Within docs/architecture.md section 13's "OpenCost, Sealed Secrets, misc | 0.3-0.5 GB | Phase
  # 13" resource budget line, leaving headroom for Sealed Secrets (Phase 15) in the same line
  # item. The chart's own defaults were not assumed adequate or excessive -- these are an
  # explicit request/limit pair for exactly this reason, same discipline as every other
  # platform component's values file in this repo (e.g. tempo-values.yaml's tempo.resources).
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  ui:
    enabled: true
