# deploy/platform/pushgateway/namespace.yaml — Phase 17 (ADR-38).
#
# pod-security.kubernetes.io/enforce: baseline, not restricted -- same reasoning, and the same
# "not yet checked for real" gap, as deploy/platform/finops/namespace.yaml (Phase 13) and
# deploy/platform/kyverno/namespace.yaml (Phase 15): nothing here has verified for real that the
# prometheus-community/prometheus-pushgateway chart's own upstream image and generated
# PodSecurityContext actually run under "restricted" (it is a third-party chart this project
# does not control the image or template for) -- tightening this once verified is a named
# follow-up, not silently skipped. A dedicated "eval" namespace, not reused from "observability"
# or "finops", for the same per-platform-piece isolation reasoning every other third-party chart
# in this project already gets its own namespace for.
apiVersion: v1
kind: Namespace
metadata:
  name: eval
  labels:
    app.kubernetes.io/part-of: polaris
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
